<div class="flex h-screen overflow-hidden transition-colors duration-300"
  [style]="darkMode
    ? 'background:#111827'
    : 'background:linear-gradient(135deg,#f0f2ff 0%,#faf5ff 100%)'">

  <!-- Mobile overlay -->
  <div *ngIf="mobileOpen" (click)="mobileOpen=false"
    class="fixed inset-0 z-40 lg:hidden"
    style="background:rgba(30,27,75,.55);backdrop-filter:blur(4px)"></div>

  <!-- ───── SIDEBAR ───── -->
  <aside [ngClass]="collapsed?'w-[72px]':'w-64'"
    class="flex-shrink-0 flex flex-col transition-all duration-300 ease-in-out z-50 relative overflow-hidden"
    style="background:linear-gradient(180deg,#0f0a2e 0%,#1a1452 40%,#251b6e 100%);
           box-shadow:4px 0 40px rgba(15,10,46,.5)">

    <!-- Decorative glow -->
    <div class="absolute -top-20 -left-20 w-56 h-56 rounded-full opacity-20 pointer-events-none"
      style="background:radial-gradient(circle,#818cf8 0%,transparent 70%)"></div>

    <!-- Logo -->
    <div class="flex items-center px-4 flex-shrink-0 relative"
      [ngClass]="collapsed?'h-[72px] justify-center':'h-[72px]'"
      style="border-bottom:1px solid rgba(129,140,248,.1)">
      <div *ngIf="!collapsed" class="flex items-center gap-3 w-full fade-up">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
          style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 20px rgba(99,102,241,.5)">
          <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-white text-[15px] tracking-tight m-0 leading-tight">CRM Pro</p>
          <p class="text-[10px] font-medium m-0 mt-0.5" style="color:#a5b4fc">Stratro Tech</p>
        </div>
        <button (click)="collapsed=true"
          class="ml-auto w-7 h-7 rounded-lg border-0 cursor-pointer transition-all duration-200 flex items-center justify-center text-indigo-300 hover:text-white hover:bg-white/10 flex-shrink-0"
          style="background:transparent">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>
      <div *ngIf="collapsed" class="flex flex-col items-center gap-0 w-full">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center"
          style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 20px rgba(99,102,241,.5)">
          <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Expand button (collapsed) -->
    <div *ngIf="collapsed" class="flex justify-center pt-3">
      <button (click)="collapsed=false"
        class="w-8 h-8 rounded-lg border-0 cursor-pointer flex items-center justify-center text-indigo-300 hover:text-white transition-all duration-200"
        style="background:rgba(255,255,255,.06)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <!-- Section label -->
    <div *ngIf="!collapsed" class="px-5 pt-6 pb-2">
      <span class="text-[10px] font-bold uppercase tracking-[0.18em]" style="color:rgba(165,180,252,.35)">Navegación</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 flex flex-col gap-1 overflow-y-auto overflow-x-hidden"
      [ngClass]="collapsed?'py-3 items-center':'py-1'">
      <button *ngFor="let item of menuItems"
        (click)="onNavigate(item.id)"
        [title]="item.label"
        class="w-full flex items-center border-0 cursor-pointer font-medium transition-all duration-200 relative group"
        [ngClass]="collapsed
          ? 'justify-center w-11 h-11 rounded-xl p-0'
          : 'px-3 py-2.5 gap-3 rounded-xl text-[13px]'"
        [style]="moduloActivo===item.id
          ? (collapsed
            ? 'background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.45)'
            : 'background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));color:#fff;border-left:0;')
          : 'background:transparent;color:rgba(199,210,254,.6)'">
        <!-- Active indicator bar -->
        <span *ngIf="moduloActivo===item.id && !collapsed"
          class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-r-full"
          style="background:linear-gradient(180deg,#818cf8,#a78bfa)"></span>
        <!-- icon -->
        <span class="flex-shrink-0 flex items-center justify-center w-5 h-5 transition-transform duration-200 group-hover:scale-110"
          [innerHTML]="item.svg"></span>
        <span *ngIf="!collapsed" class="truncate leading-none">{{ item.label }}</span>
        <!-- collapsed tooltip -->
        <span *ngIf="collapsed"
          class="pointer-events-none absolute left-full ml-4 px-3 py-2 rounded-lg text-xs font-semibold text-white whitespace-nowrap opacity-0 group-hover:opacity-100 translate-x-1 group-hover:translate-x-0 transition-all duration-200 z-50"
          style="background:#1e1b4b;box-shadow:0 8px 32px rgba(15,10,46,.6);border:1px solid rgba(129,140,248,.15)">
          {{ item.label }}
          <span class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1 w-2 h-2 rotate-45" style="background:#1e1b4b;border-left:1px solid rgba(129,140,248,.15);border-bottom:1px solid rgba(129,140,248,.15)"></span>
        </span>
      </button>
    </nav>

    <!-- Divider -->
    <div class="mx-4 my-2" style="height:1px;background:linear-gradient(90deg,transparent,rgba(129,140,248,.15),transparent)"></div>

    <!-- User -->
    <div *ngIf="!collapsed" class="mx-3 mb-3 p-3 rounded-xl"
      style="background:rgba(255,255,255,.04);border:1px solid rgba(129,140,248,.08);backdrop-filter:blur(8px)">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0 relative"
          style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">
          A
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2" style="border-color:#1a1452"></span>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white m-0">Administrador</p>
          <p class="text-[10px] m-0 mt-0.5 truncate" style="color:rgba(165,180,252,.6)">admin&#64;crm.pro</p>
        </div>
        <button class="ml-auto w-7 h-7 rounded-lg flex items-center justify-center border-0 cursor-pointer text-indigo-300 hover:text-white hover:bg-white/10 transition-all"
          style="background:transparent" title="Cerrar sesión">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
    <div *ngIf="collapsed" class="flex justify-center pb-3">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold text-white relative cursor-pointer hover:scale-105 transition-transform"
        style="background:linear-gradient(135deg,#6366f1,#8b5cf6)">
        A
        <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2" style="border-color:#1a1452"></span>
      </div>
    </div>
  </aside>

  <!-- ───── MAIN ───── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <header class="h-16 flex items-center px-6 gap-4 flex-shrink-0 transition-colors duration-300"
      [style]="darkMode
        ? 'background:rgba(17,24,39,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(75,85,99,.3);box-shadow:0 1px 12px rgba(0,0,0,.2)'
        : 'background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(99,102,241,.1);box-shadow:0 1px 12px rgba(99,102,241,.06)'">
      <button (click)="mobileOpen=true" class="lg:hidden border-0 cursor-pointer p-2 rounded-xl text-indigo-600 hover:bg-indigo-50">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Page title -->
      <div class="flex items-center gap-2.5">
        <div class="w-1 h-6 rounded-full" style="background:linear-gradient(180deg,#6366f1,#a78bfa)"></div>
        <h1 class="text-sm font-bold m-0" [style.color]="darkMode ? '#f3f4f6' : '#1e1b4b'">{{ getActiveLabel() }}</h1>
      </div>

      <!-- Right side -->
      <div class="ml-auto flex items-center gap-2">
        <!-- Theme toggle -->
        <button (click)="toggleTheme()"
          class="w-9 h-9 rounded-xl flex items-center justify-center border-0 cursor-pointer transition-all duration-200 hover:scale-105"
          [style]="darkMode
            ? 'background:rgba(250,204,21,.1);color:#fbbf24'
            : 'background:rgba(99,102,241,.08);color:#6366f1'"
          [title]="darkMode ? 'Modo claro' : 'Modo oscuro'">
          <!-- Sun icon (shown in dark mode) -->
          <svg *ngIf="darkMode" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg *ngIf="!darkMode" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- Search hint -->
        <div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium text-indigo-400 cursor-text"
          style="background:rgba(99,102,241,.06);border:1.5px solid rgba(99,102,241,.1)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Buscar…</span>
          <kbd class="px-1.5 py-0.5 rounded text-[10px]" style="background:rgba(99,102,241,.1);color:#6366f1">⌘K</kbd>
        </div>
        <!-- Bell -->
        <button class="relative w-9 h-9 rounded-xl flex items-center justify-center border-0 cursor-pointer transition-all hover:scale-105"
          style="background:rgba(99,102,241,.08);color:#6366f1">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full flex items-center justify-center text-[8px] font-bold text-white"
            style="background:linear-gradient(135deg,#f43f5e,#e11d48)">3</span>
        </button>
        <!-- Avatar -->
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold text-white cursor-pointer hover:scale-105 transition-transform"
          style="background:linear-gradient(135deg,#6366f1,#a78bfa);box-shadow:0 2px 10px rgba(99,102,241,.38)">A</div>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-5 transition-colors duration-300"
      [style]="darkMode ? 'background:#0f1729' : ''">
      <ng-content></ng-content>
    </main>
  </div>
</div>

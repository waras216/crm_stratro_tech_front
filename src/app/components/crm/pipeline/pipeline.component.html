<div class="flex flex-col gap-5 page-enter">
  <!-- Toolbar -->
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="relative flex items-center">
      <svg class="absolute left-3 text-indigo-400 pointer-events-none w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input [(ngModel)]="search" class="pl-9 pr-4 py-2.5 rounded-xl text-sm font-medium w-52 focus:outline-none" style="background:#fff;border:1.5px solid rgba(99,102,241,.15);color:#1e1b4b" placeholder="Buscar pipelines…" />
    </div>
    <app-button *appPuede="'pipelines.crear'" (click)="openNew()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo Pipeline
    </app-button>
  </div>

  <!-- Skeleton loader -->
  <div *ngIf="cargando" class="rounded-2xl overflow-hidden" style="background:var(--bg-card);box-shadow:var(--shadow-card)">
    <div *ngFor="let _ of [1,2,3]" class="flex items-center gap-3 px-4 py-4 border-b border-slate-50 last:border-0">
      <div class="w-8 h-8 rounded-xl bg-slate-100 animate-pulse flex-shrink-0"></div>
      <div class="flex-1 flex flex-col gap-2"><div class="h-3 bg-slate-100 rounded-full w-1/3 animate-pulse"></div></div>
    </div>
  </div>

  <!-- List -->
  <div *ngIf="!cargando" class="flex flex-col gap-3">
    <div *ngFor="let p of filtered; let i = index" class="rounded-2xl p-4 hover-lift group card-enter" [style.animation-delay]="(i * 0.04) + 's'" style="background:var(--bg-card);box-shadow:var(--shadow-card)">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0" style="background:#eef2ff;color:#6366f1">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-slate-700 m-0">{{ p.nombre }}</p>
        </div>
        <button *appPuede="'pipelines.editar'" (click)="toggleActivo(p)" class="px-2.5 py-1 rounded-full text-[10px] font-semibold border-0 cursor-pointer" [style]="p.activo ? 'background:#ecfdf5;color:#059669' : 'background:#f1f5f9;color:#64748b'">
          {{ p.activo ? 'Activo' : 'Inactivo' }}
        </button>
        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
          <button *appPuede="'pipelines.editar'" (click)="handleEdit(p)" aria-label="Editar pipeline" class="w-7 h-7 rounded-lg flex items-center justify-center border-0 cursor-pointer hover:scale-110 transition-all" style="background:#eef2ff;color:#6366f1">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button *appPuede="'pipelines.eliminar'" (click)="deletePipeline(p.id_pipeline)" aria-label="Eliminar pipeline" class="w-7 h-7 rounded-lg flex items-center justify-center border-0 cursor-pointer hover:scale-110 transition-all" style="background:#fff1f2;color:#e11d48">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="filtered.length===0" class="py-16 text-center flex flex-col items-center gap-2">
      <svg width="40" height="40" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <p class="text-sm font-semibold text-slate-400">No hay pipelines</p>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="dialogOpen" class="fixed inset-0 z-[100]" style="background:rgba(30,27,75,.5);backdrop-filter:blur(6px)" (click)="closeDialog()"></div>
<div *ngIf="dialogOpen" [@modalLeave] class="modal-in fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92%] max-w-md z-[101] overflow-hidden" style="background:var(--bg-card);border-radius:24px;box-shadow:0 24px 64px rgba(30,27,75,.24)">
 <div class="max-h-[90vh] overflow-y-auto">
  <div class="px-6 pt-6 pb-4" style="background:var(--bg-card-hover);border-radius:24px 24px 0 0">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="m-0 text-sm font-bold" style="color:#1e1b4b">{{ editingPipeline ? 'Editar Pipeline' : 'Nuevo Pipeline' }}</h2>
        <p class="text-[11px] text-slate-400 m-0 mt-0.5">Los pipelines agrupan tus oportunidades por embudo de ventas</p>
      </div>
      <button (click)="closeDialog()" aria-label="Cerrar" class="w-8 h-8 rounded-xl flex items-center justify-center border-0 cursor-pointer hover:scale-110 transition-all" style="background:rgba(99,102,241,.1);color:#6366f1">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="px-6 py-5 flex flex-col gap-4">
    <div *ngIf="formError" class="px-4 py-2.5 rounded-xl text-sm font-medium" style="background:#fff1f2;border:1.5px solid #fecdd3;color:#e11d48">{{ formError }}</div>
    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold" style="color:#6366f1">Nombre *</label>
      <input [(ngModel)]="form.nombre" placeholder="Ej. Ventas, Servicios" class="px-4 py-2.5 rounded-xl text-sm font-medium focus:outline-none" style="background:#faf5ff;border:2px solid #e0e7ff;color:#1e1b4b" />
    </div>
    <div class="flex items-center gap-3">
      <div (click)="form.activo = !form.activo" class="w-9 h-5 rounded-full transition-colors cursor-pointer relative flex-shrink-0"
        [style.background]="form.activo ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : '#e2e8f0'">
        <div class="absolute top-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform" [class.translate-x-4]="form.activo" [class.translate-x-0.5]="!form.activo"></div>
      </div>
      <span class="text-xs font-medium text-slate-600">Pipeline activo</span>
    </div>
    <app-button (click)="handleSubmit()" [fullWidth]="true" size="lg">
      {{ editingPipeline ? 'Guardar Cambios' : 'Crear Pipeline' }}
    </app-button>
  </div>
 </div>
</div>

<div class="flex flex-col gap-6 page-enter">
  <!-- Toolbar -->

  <!-- Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
    <div class="bg-white border border-slate-200 rounded-xl p-4 hover-lift card-enter" *ngFor="let camp of filtered; let i = index"
      [style.animation-delay]="(i * 0.05) + 's'">
      <div class="flex items-start justify-between mb-3">
        <div>
          <h3 class="font-semibold text-sm m-0">{{ camp.nombre_compania }}</h3>
          <p class="text-slate-500 text-xs m-0 mt-0.5">{{ camp.segmento }}</p>
        </div>
        <div class="flex items-center gap-1">
          <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100 text-base" (click)="handleEdit(camp)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100 text-base" (click)="deleteCampana(camp.id)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
      </div>
      <div class="flex items-center gap-2 mb-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" [ngClass]="estadoColors[camp.estado || 'activa']">{{ camp.estado }}</span>
        <span class="text-slate-400 text-xs">Inicio: {{ camp.fecha_inicio }}</span>
      </div>
      <button class="w-full text-left text-sm text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-lg px-3 py-2 border-0 cursor-pointer"
        (click)="toggleExpanded(camp.id)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> {{ camp.n_contacto }} contactos
      </button>
      <div *ngIf="expandedCamp===camp.id" class="mt-3 flex flex-col gap-2">
        <div class="flex items-center gap-2" *ngFor="let c of camp.lista_contactos">
          <div class="w-7 h-7 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xs font-semibold flex-shrink-0">{{ c.nombre.charAt(0) }}</div>
          <div>
            <p class="font-medium text-xs m-0">{{ c.nombre }}</p>
            <p class="text-slate-400 text-xs m-0"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>️ {{ c.email }}<span *ngIf="c.telefono"> · <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1 19.79 19.79 0 0 1 1.62 4.5 2 2 0 0 1 3.59 2.32h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.09 6.09l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 17z"/></svg> {{ c.telefono }}</span></p>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="filtered.length===0" class="col-span-full text-center text-slate-400 py-12">No se encontraron campañas</div>
  </div>
</div>

<!-- Modal: kept outside the page-enter wrapper so position:fixed anchors to the viewport, not to the animated (transformed) container -->
<!-- Modal backdrop -->
<div *ngIf="dialogOpen" class="fixed inset-0 bg-black/45 z-[100]" (click)="closeDialog()"></div>
<!-- Modal -->
<div *ngIf="dialogOpen" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl w-[90%] max-w-lg z-[101] shadow-2xl max-h-[90vh] overflow-y-auto">
  <div class="flex justify-between items-center px-6 pt-5">
    <h2 class="m-0 text-lg font-semibold">{{ editingCamp ? 'Editar Campaña' : 'Nueva Campaña' }}</h2>
    <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100" (click)="closeDialog()"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="px-6 py-5 flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600">Nombre *</label>
      <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.nombre_compania" placeholder="Nombre de la campaña" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Segmento</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.segmento" placeholder="Ej: Empresas Tecnología" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Fecha de Inicio</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" type="date" [(ngModel)]="form.fecha_inicio" />
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600">Estado</label>
      <select class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 cursor-pointer" [(ngModel)]="form.estado">
        <option value="activa">Activa</option>
        <option value="pausada">Pausada</option>
        <option value="finalizada">Finalizada</option>
      </select>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-medium text-slate-600">Contactos (uno por línea: Nombre, Email, Teléfono)</label>
      <textarea class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400 resize-none"
        [(ngModel)]="contactosInput" placeholder="Juan Pérez, juan@email.com, 555-0000&#10;María García, maria@email.com" rows="4"></textarea>
    </div>
    <button class="w-full px-4 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 border-0 cursor-pointer" (click)="handleSubmit()">
      {{ editingCamp ? 'Guardar Cambios' : 'Crear Campaña' }}
    </button>
  </div>
</div>

<div class="flex flex-col gap-6 page-enter">
  <!-- Toolbar -->
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="relative flex items-center">
      <span class="absolute left-2.5 text-sm pointer-events-none"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
      <input class="pl-8 pr-3 py-2 border border-slate-200 rounded-lg text-sm w-56 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100"
        placeholder="Buscar automatizaciones..." [(ngModel)]="search" />
    </div>
    <button class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 border-0 cursor-pointer"
      (click)="openNew()">+ Nueva Automatización</button>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
    <div class="bg-white border border-slate-200 rounded-xl p-4 hover-lift card-enter" *ngFor="let auto of filtered; let i = index"
      [style.animation-delay]="(i * 0.05) + 's'"
      [class.opacity-60]="!auto.activa">
      <div class="flex items-start justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl"
            [class.bg-amber-100]="auto.activa" [class.bg-slate-100]="!auto.activa"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
          <div>
            <h3 class="font-semibold text-sm m-0">{{ auto.nombre_automatizacion }}</h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                [class.bg-green-100]="auto.activa" [class.text-green-700]="auto.activa"
                [class.bg-slate-100]="!auto.activa" [class.text-slate-500]="!auto.activa">
                {{ auto.activa ? 'Activa' : 'Inactiva' }}
              </span>
              <span class="text-slate-400 text-xs">{{ auto.fecha_creacion }}</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100 text-base" (click)="toggle(auto.id)" [title]="auto.activa ? 'Desactivar' : 'Activar'"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></button>
          <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100 text-base" (click)="handleEdit(auto)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100 text-base" (click)="delete(auto.id)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
        </div>
      </div>
      <div class="flex flex-col gap-2 border-t border-slate-100 pt-3">
        <div class="flex gap-2 text-sm">
          <span class="text-slate-400 font-medium text-xs w-20 flex-shrink-0">▶ Regla</span>
          <p class="text-slate-600 text-xs m-0">{{ auto.regla }}</p>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="text-slate-400 font-medium text-xs w-20 flex-shrink-0"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Evento</span>
          <p class="text-slate-600 text-xs m-0">{{ auto.evento }}</p>
        </div>
        <div class="flex gap-2 text-sm">
          <span class="text-slate-400 font-medium text-xs w-20 flex-shrink-0"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg> Acción</span>
          <p class="text-slate-600 text-xs m-0">{{ auto.accion }}</p>
        </div>
      </div>
    </div>
    <div *ngIf="filtered.length===0" class="col-span-full text-center text-slate-400 py-12">No se encontraron automatizaciones</div>
  </div>

  <!-- Modal backdrop -->
  <div *ngIf="dialogOpen" class="fixed inset-0 bg-black/45 z-[100]" (click)="closeDialog()"></div>
  <!-- Modal -->
  <div *ngIf="dialogOpen" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl w-[90%] max-w-lg z-[101] shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center px-6 pt-5">
      <h2 class="m-0 text-lg font-semibold">{{ editingAuto ? 'Editar Automatización' : 'Nueva Automatización' }}</h2>
      <button class="bg-transparent border-0 cursor-pointer p-1.5 rounded text-slate-500 hover:bg-slate-100" (click)="closeDialog()"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="px-6 py-5 flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Nombre *</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.nombre_automatizacion" placeholder="Ej: Bienvenida Nuevo Lead" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Regla (Condición) *</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.regla" placeholder="Ej: Cuando se crea un nuevo lead" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Evento Disparador *</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.evento" placeholder="Ej: lead_creado" />
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Acción a Ejecutar *</label>
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-400" [(ngModel)]="form.accion" placeholder="Ej: Enviar email de bienvenida" />
      </div>
      <div *ngIf="editingAuto" class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="form.activa" class="rounded" id="activa" />
        <label for="activa" class="text-sm text-slate-600 cursor-pointer">Activa</label>
      </div>
      <button class="w-full px-4 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 border-0 cursor-pointer" (click)="handleSubmit()">
        {{ editingAuto ? 'Guardar Cambios' : 'Crear Automatización' }}
      </button>
    </div>
  </div>
</div>

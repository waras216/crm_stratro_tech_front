<div class="flex flex-col h-full bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm slide-right">
  <!-- Header -->
  <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-2">
      <svg width="16" height="16" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <span class="text-sm font-bold text-slate-800">Carrito</span>
      <span *ngIf="totalItems > 0" class="w-5 h-5 rounded-full bg-emerald-600 text-white text-[10px] font-bold flex items-center justify-center">{{ totalItems }}</span>
    </div>
    <button *ngIf="items.length > 0" (click)="limpiar.emit()" class="text-[11px] text-red-500 font-medium bg-transparent border-0 cursor-pointer hover:text-red-700">Limpiar</button>
  </div>

  <!-- Items -->
  <div class="flex-1 overflow-y-auto px-3 py-2">
    <div *ngIf="items.length === 0" class="flex flex-col items-center justify-center h-full text-slate-300">
      <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <p class="text-xs mt-2">Carrito vacío</p>
    </div>
    <div *ngFor="let item of items" class="flex items-center gap-2 py-2 border-b border-slate-50">
      <span class="text-lg flex-shrink-0">📦</span>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium text-slate-700 m-0 truncate">{{ item.producto.nombre }}</p>
        <p class="text-xs text-emerald-600 font-semibold m-0">${{ (item.producto.precio * item.cantidad).toLocaleString() }}</p>
      </div>
      <div class="flex items-center gap-1">
        <button (click)="cambiarCantidad.emit({id: item.producto.id_productos, delta: -1})"
          class="w-6 h-6 rounded-md bg-slate-100 border-0 cursor-pointer text-slate-600 hover:bg-slate-200 flex items-center justify-center text-sm font-bold">−</button>
        <span class="w-6 text-center text-xs font-bold">{{ item.cantidad }}</span>
        <button (click)="cambiarCantidad.emit({id: item.producto.id_productos, delta: 1})"
          class="w-6 h-6 rounded-md bg-slate-100 border-0 cursor-pointer text-slate-600 hover:bg-slate-200 flex items-center justify-center text-sm font-bold">+</button>
      </div>
      <button (click)="quitar.emit(item.producto.id_productos)" class="p-1 bg-transparent border-0 cursor-pointer text-slate-300 hover:text-red-500">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Totals -->
  <div class="border-t border-slate-100 px-4 py-3 flex flex-col gap-1.5 flex-shrink-0">
    <div class="flex justify-between text-xs text-slate-500"><span>Subtotal</span><span>${{ subtotal.toLocaleString() }}</span></div>
    <div class="flex justify-between text-xs text-slate-500"><span>IVA (16%)</span><span>${{ iva.toLocaleString() }}</span></div>
    <div class="flex justify-between text-sm font-bold text-slate-800 pt-1 border-t border-slate-100"><span>Total</span><span class="text-emerald-600">${{ total.toLocaleString() }}</span></div>
    <button (click)="cobrar.emit()" [disabled]="items.length===0"
      class="w-full mt-2 px-4 py-3 rounded-xl border-0 cursor-pointer text-sm font-bold text-white transition-all"
      [ngClass]="items.length > 0 ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-slate-300 cursor-not-allowed'">
      💳 Cobrar ${{ total.toLocaleString() }}
    </button>
  </div>
</div>

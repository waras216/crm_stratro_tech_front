<div *ngIf="visible" class="fixed inset-0 bg-black/45 backdrop-blur-sm z-[100]" (click)="onCancelar()"></div>
<div *ngIf="visible" [@modalLeave] class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl w-96 p-6 shadow-2xl z-[101] modal-in" (click)="$event.stopPropagation()">
    <div class="text-center mb-4">
      <h3 class="m-0 text-lg font-bold text-slate-800">Modalidad de pago</h3>
      <p class="text-xs text-slate-400 mt-1">Total a cobrar: <span class="font-semibold text-emerald-600">${{ total.toLocaleString() }}</span></p>
    </div>

    <div class="flex flex-col gap-2 mb-3 max-h-64 overflow-y-auto">
      <div *ngFor="let fila of filas; let i = index" class="flex gap-2 items-center">
        <select [(ngModel)]="fila.metodo_pago" class="flex-1 border border-slate-200 rounded-lg px-2 py-2 text-sm text-slate-700">
          <option *ngFor="let m of metodos" [value]="m.valor">{{ m.etiqueta }}</option>
        </select>
        <input type="number" min="0" step="0.01" [(ngModel)]="fila.monto"
          class="w-28 border border-slate-200 rounded-lg px-2 py-2 text-sm text-slate-700 text-right" />
        <button *ngIf="filas.length > 1" (click)="quitarFila(i)"
          class="w-7 h-7 flex-shrink-0 rounded-lg border-0 bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 cursor-pointer text-sm">×</button>
      </div>
    </div>

    <button (click)="agregarFila()"
      class="w-full py-2 mb-4 bg-slate-50 text-slate-600 rounded-lg border border-dashed border-slate-300 cursor-pointer text-xs font-semibold hover:bg-slate-100">
      + Agregar otro método de pago
    </button>

    <div class="border-t border-slate-100 pt-3 mb-4 flex justify-between text-xs">
      <span class="text-slate-400">Asignado: ${{ asignado.toLocaleString() }}</span>
      <span [class]="valido ? 'text-emerald-600 font-semibold' : 'text-amber-600 font-semibold'">
        {{ valido ? 'Listo' : (diferencia > 0 ? 'Falta: $' + diferencia.toLocaleString() : 'Sobra: $' + (-diferencia).toLocaleString()) }}
      </span>
    </div>

    <div class="flex gap-2">
      <button (click)="onCancelar()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 rounded-xl border-0 cursor-pointer text-sm font-semibold hover:bg-slate-200">Cancelar</button>
      <button (click)="onConfirmar()" [disabled]="!valido"
        class="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl border-0 cursor-pointer text-sm font-semibold hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed">Confirmar</button>
    </div>
</div>

<div class="flex flex-col gap-3 h-full">
  <input class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100 bg-white"
    placeholder="Buscar producto..." [(ngModel)]="search" />
  <div class="flex gap-2 overflow-x-auto pb-1 flex-shrink-0">
    <button *ngFor="let cat of categorias"
      (click)="categoriaActiva=cat"
      class="px-3 py-1.5 rounded-full text-xs font-semibold border-0 cursor-pointer whitespace-nowrap transition-all"
      [ngClass]="categoriaActiva===cat ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'">
      {{ cat }}
    </button>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 overflow-y-auto flex-1">
    <button *ngFor="let p of filtrados"
      (click)="agregar.emit(p)"
      class="flex flex-col items-center gap-1.5 p-3 bg-white border border-slate-100 rounded-xl cursor-pointer hover:shadow-md hover:border-emerald-200 transition-all group text-center"
      style="border:1px solid #e2e8f0">
      <span class="text-2xl group-hover:scale-110 transition-transform">{{ p.imagen }}</span>
      <span class="text-[11px] font-semibold text-slate-700 leading-tight">{{ p.nombre }}</span>
      <span class="text-sm font-bold text-emerald-600">${{ p.precio }}</span>
    </button>
  </div>
</div>

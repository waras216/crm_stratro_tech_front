<div class="min-h-screen flex items-center justify-center p-4"
  style="background:linear-gradient(135deg,#0f0a2e 0%,#1a1452 50%,#251b6e 100%)">
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="blob absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-25" style="background:radial-gradient(circle,#818cf8,transparent 70%)"></div>
    <div class="blob blob--delay absolute -bottom-40 -left-40 w-96 h-96 rounded-full opacity-25" style="background:radial-gradient(circle,#a78bfa,transparent 70%)"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8">
      <div class="logo-badge w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
        style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 32px rgba(99,102,241,.4)">
        <svg width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
        </svg>
      </div>
      <h1 class="fade-up fade-up--d1 text-2xl font-extrabold text-white m-0">Crear Cuenta</h1>
      <p class="fade-up fade-up--d2 text-sm mt-1 m-0" style="color:#a5b4fc">Comienza tu prueba gratuita</p>
    </div>

    <div class="fade-up fade-up--d3 bg-white/[.04] backdrop-blur-xl rounded-2xl p-8 border border-white/10">
      <div class="flex flex-col gap-4">
        <div *ngIf="error" class="error-shake px-4 py-2.5 rounded-xl text-sm font-medium text-red-300 border border-red-500/30"
          style="background:rgba(239,68,68,.1)">{{ error }}</div>

        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium" style="color:#c7d2fe">Nombre(s)</label>
            <input type="text" [(ngModel)]="nombre" placeholder="Juan"
              class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
              style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-xs font-medium" style="color:#c7d2fe">Apellido(s)</label>
            <input type="text" [(ngModel)]="apellido" placeholder="Pérez"
              class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
              style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium" style="color:#c7d2fe">Email</label>
          <input type="email" [(ngModel)]="email" placeholder="tu@email.com"
            class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium" style="color:#c7d2fe">Contraseña</label>
          <input type="password" [(ngModel)]="password" placeholder="Mínimo 6 caracteres"
            class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium" style="color:#c7d2fe">Confirmar contraseña</label>
          <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••"
            class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)"
            (keyup.enter)="submit()" />
        </div>

        <button (click)="submit()"
          class="btn-submit w-full py-3 rounded-xl border-0 cursor-pointer text-sm font-bold text-white mt-1"
          style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 20px rgba(99,102,241,.4)">
          Crear Cuenta
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-1">
          <div class="flex-1 h-px" style="background:rgba(129,140,248,.15)"></div>
          <span class="text-[11px] font-medium" style="color:rgba(165,180,252,.5)">o continúa con</span>
          <div class="flex-1 h-px" style="background:rgba(129,140,248,.15)"></div>
        </div>

        <!-- Social buttons -->
        <div class="flex gap-3">
          <button (click)="socialLogin('google')"
            class="social-btn flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl border cursor-pointer text-sm font-medium text-white transition-all hover:bg-white/10"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)">
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button (click)="socialLogin('facebook')"
            class="social-btn flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl border cursor-pointer text-sm font-medium text-white transition-all hover:bg-white/10"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Facebook
          </button>
          <button (click)="socialLogin('apple')"
            class="social-btn flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl border cursor-pointer text-sm font-medium text-white transition-all hover:bg-white/10"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff">
              <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
            Apple
          </button>
        </div>
      </div>

      <p class="text-center text-xs mt-6 m-0" style="color:#a5b4fc">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login" class="link-underline font-semibold text-white cursor-pointer">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>

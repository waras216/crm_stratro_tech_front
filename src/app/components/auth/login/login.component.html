<div class="min-h-screen flex items-center justify-center p-4"
  style="background:linear-gradient(135deg,#0f0a2e 0%,#1a1452 50%,#251b6e 100%)">
  <!-- Decorative -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="blob absolute -top-40 -right-40 w-96 h-96 rounded-full opacity-25" style="background:radial-gradient(circle,#818cf8,transparent 70%)"></div>
    <div class="blob blob--delay absolute -bottom-40 -left-40 w-96 h-96 rounded-full opacity-25" style="background:radial-gradient(circle,#a78bfa,transparent 70%)"></div>
  </div>

  <div class="relative w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="logo-badge relative w-20 h-20 flex items-center justify-center mx-auto mb-4">
        <div class="logo-glow absolute inset-0 -z-10" style="background:radial-gradient(circle,rgba(99,102,241,.55),transparent 70%);filter:blur(16px)"></div>
        <img src="/images/logo-stratro.png" alt="Strato Tech Solutions" class="w-full h-full object-contain"
          style="filter:drop-shadow(0 0 10px rgba(129,140,248,.8)) drop-shadow(0 0 22px rgba(99,102,241,.5))" />
      </div>
      <h1 class="fade-up fade-up--d1 text-2xl font-extrabold text-white m-0">Strato Hub</h1>
      <p class="fade-up fade-up--d2 text-sm mt-1 m-0" style="color:#a5b4fc">Inicia sesión en tu cuenta</p>
    </div>

    <!-- Card -->
    <div class="fade-up fade-up--d3 bg-white/[.04] backdrop-blur-xl rounded-2xl p-8 border border-white/10">
      <div class="flex flex-col gap-5">
        <!-- Error -->
        <div *ngIf="error" class="error-shake px-4 py-2.5 rounded-xl text-sm font-medium text-red-300 border border-red-500/30"
          style="background:rgba(239,68,68,.1)">{{ error }}</div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium" style="color:#c7d2fe">Email</label>
          <input type="email" [(ngModel)]="email" placeholder="tu@email.com"
            class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-medium" style="color:#c7d2fe">Contraseña</label>
          <input type="password" [(ngModel)]="password" placeholder="••••••••"
            class="input-field w-full px-4 py-3 rounded-xl border text-sm text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
            style="background:rgba(255,255,255,.05);border-color:rgba(129,140,248,.2)"
            (keyup.enter)="submit()" />
          <a routerLink="/auth/forgot-password" class="link-underline text-xs self-end cursor-pointer" style="color:#a5b4fc">¿Olvidaste tu contraseña?</a>
        </div>

        <button (click)="submit()"
          class="btn-submit w-full py-3 rounded-xl border-0 cursor-pointer text-sm font-bold text-white"
          style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 20px rgba(99,102,241,.4)">
          Iniciar Sesión
        </button>

        <div class="flex items-center gap-3">
          <div class="flex-1 h-px" style="background:rgba(129,140,248,.2)"></div>
          <span class="text-[11px]" style="color:#a5b4fc">o</span>
          <div class="flex-1 h-px" style="background:rgba(129,140,248,.2)"></div>
        </div>

        <button (click)="continuarConGoogle()" type="button"
          class="w-full py-3 rounded-xl cursor-pointer text-sm font-semibold text-white flex items-center justify-center gap-2"
          style="background:rgba(255,255,255,.05);border:1px solid rgba(129,140,248,.2)">
          Continuar con Google
        </button>
      </div>

      <p class="text-center text-xs mt-6 m-0" style="color:#a5b4fc">
        ¿No tienes cuenta?
        <a routerLink="/auth/registro" class="link-underline font-semibold text-white cursor-pointer">Regístrate</a>
      </p>
    </div>
  </div>
</div>

<div class="space-y">
  <div class="toolbar">
    <div class="toolbar-left flex-wrap">
      <div class="search-wrap"><span class="search-icon">🔍</span><input class="input" placeholder="Buscar actividades..." [(ngModel)]="search" /></div>
      <select class="select" [(ngModel)]="filterTipo">
        <option value="todos">Todos</option>
        <option *ngFor="let t of tipoOptions" [value]="t">{{ t }}</option>
      </select>
      <label class="switch-label">
        <input type="checkbox" [(ngModel)]="showCompleted" /> Mostrar completadas
      </label>
    </div>
    <button class="btn btn-primary" (click)="openNew()">+ Nueva Actividad</button>
  </div>

  <div class="act-list">
    <div class="card act-card" *ngFor="let act of filtered" [class.completed]="act.completada">
      <div class="act-row">
        <button class="toggle-btn" (click)="toggleActividad(act.id_pk)">
          <span *ngIf="act.completada" class="icon-done">✅</span>
          <span *ngIf="!act.completada" class="icon-pending"></span>
        </button>
        <div class="tipo-icon" [ngClass]="tipoColors[act.tipo_actividad]">{{ tipoIcons[act.tipo_actividad] }}</div>
        <div class="act-content">
          <p class="fw-medium" [class.line-through]="act.completada" [class.text-muted]="act.completada">{{ act.actividad }}</p>
          <div class="act-meta">
            <span class="badge" [ngClass]="tipoColors[act.tipo_actividad]">{{ act.tipo_actividad }}</span>
            <span class="text-muted text-xs">⏰ {{ act.fecha }}</span>
            <span class="text-xs text-amber" *ngIf="act.recordatorio">🔔 {{ act.recordatorio.replace('T', ' ') }}</span>
          </div>
        </div>
        <div class="flex-row">
          <button class="btn-ghost" (click)="handleEdit(act)">✏️</button>
          <button class="btn-ghost" (click)="deleteActividad(act.id_pk)">🗑️</button>
        </div>
      </div>
    </div>
    <div class="empty-state" *ngIf="filtered.length === 0">No se encontraron actividades</div>
  </div>

  <div class="modal-backdrop" *ngIf="dialogOpen" (click)="closeDialog()"></div>
  <div class="modal" *ngIf="dialogOpen">
    <div class="modal-header"><h2>{{ editingAct ? 'Editar Actividad' : 'Nueva Actividad' }}</h2><button class="btn-ghost" (click)="closeDialog()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Actividad *</label><input class="input" [(ngModel)]="form.actividad" placeholder="Descripción de la actividad" /></div>
      <div class="form-row">
        <div class="form-group"><label>Tipo</label>
          <select class="select w-full" [(ngModel)]="form.tipo_actividad">
            <option *ngFor="let t of tipoOptions" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="form-group"><label>Fecha</label><input class="input" type="date" [(ngModel)]="form.fecha" /></div>
      </div>
      <div class="form-group"><label>Recordatorio</label><input class="input" type="datetime-local" [(ngModel)]="form.recordatorio" /></div>
      <div class="form-group" *ngIf="editingAct">
        <label class="switch-label"><input type="checkbox" [(ngModel)]="form.completada" /> Completada</label>
      </div>
      <button class="btn btn-primary w-full" (click)="handleSubmit()">{{ editingAct ? 'Guardar Cambios' : 'Crear Actividad' }}</button>
    </div>
  </div>
</div>

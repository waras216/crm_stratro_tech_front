<div class="space-y">
  <div class="toolbar">
    <div class="search-wrap"><span class="search-icon">🔍</span><input class="input" placeholder="Buscar automatizaciones..." [(ngModel)]="search" /></div>
    <button class="btn btn-primary" (click)="openNew()">+ Nueva Automatización</button>
  </div>

  <div class="auto-grid">
    <div class="card" *ngFor="let auto of filtered" [class.inactive]="!auto.activa">
      <div class="auto-header">
        <div class="flex-row gap-12">
          <div class="auto-icon" [class.active]="auto.activa">⚡</div>
          <div>
            <h3 class="fw-semibold">{{ auto.nombre_automatizacion }}</h3>
            <div class="flex-row mt-4">
              <span class="badge" [class.badge-green]="auto.activa" [class.badge-slate]="!auto.activa">{{ auto.activa ? 'Activa' : 'Inactiva' }}</span>
              <span class="text-muted text-xs">{{ auto.fecha_creacion }}</span>
            </div>
          </div>
        </div>
        <div class="flex-row">
          <button class="btn-ghost" (click)="toggle(auto.id)" [title]="auto.activa ? 'Desactivar' : 'Activar'">🔌</button>
          <button class="btn-ghost" (click)="handleEdit(auto)">✏️</button>
          <button class="btn-ghost" (click)="delete(auto.id)">🗑️</button>
        </div>
      </div>
      <div class="auto-rules">
        <div class="rule-row"><span class="rule-label">▶ Regla</span><p>{{ auto.regla }}</p></div>
        <div class="rule-row"><span class="rule-label">⚡ Evento</span><p>{{ auto.evento }}</p></div>
        <div class="rule-row"><span class="rule-label">🔌 Acción</span><p>{{ auto.accion }}</p></div>
      </div>
    </div>
    <div class="empty-state" *ngIf="filtered.length===0">No se encontraron automatizaciones</div>
  </div>

  <div class="modal-backdrop" *ngIf="dialogOpen" (click)="closeDialog()"></div>
  <div class="modal" *ngIf="dialogOpen">
    <div class="modal-header"><h2>{{ editingAuto ? 'Editar Automatización' : 'Nueva Automatización' }}</h2><button class="btn-ghost" (click)="closeDialog()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Nombre *</label><input class="input" [(ngModel)]="form.nombre_automatizacion" placeholder="Ej: Bienvenida Nuevo Lead" /></div>
      <div class="form-group"><label>Regla (Condición) *</label><input class="input" [(ngModel)]="form.regla" placeholder="Ej: Cuando se crea un nuevo lead" /></div>
      <div class="form-group"><label>Evento Disparador *</label><input class="input" [(ngModel)]="form.evento" placeholder="Ej: lead_creado" /></div>
      <div class="form-group"><label>Acción a Ejecutar *</label><input class="input" [(ngModel)]="form.accion" placeholder="Ej: Enviar email de bienvenida" /></div>
      <div class="form-group" *ngIf="editingAuto">
        <label class="switch-label"><input type="checkbox" [(ngModel)]="form.activa" /> Activa</label>
      </div>
      <button class="btn btn-primary w-full" (click)="handleSubmit()">{{ editingAuto ? 'Guardar Cambios' : 'Crear Automatización' }}</button>
    </div>
  </div>
</div>

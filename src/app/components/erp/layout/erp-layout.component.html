<div class="flex h-screen overflow-hidden transition-colors duration-300"
  [style]="darkMode
    ? 'background:#111827'
    : 'background:linear-gradient(135deg,#fffbeb 0%,#fef3c7 100%)'">

  <!-- Mobile overlay -->
  <div *ngIf="mobileOpen" (click)="mobileOpen=false"
    class="fixed inset-0 z-40 lg:hidden"
    style="background:rgba(30,27,75,.55);backdrop-filter:blur(4px)"></div>

  <!-- ───── SIDEBAR ───── -->
  <aside [ngClass]="collapsed?'w-[72px]':'w-64'"
    class="flex-shrink-0 flex flex-col transition-all duration-300 ease-in-out z-50 relative overflow-hidden"
    style="background:linear-gradient(180deg,#451a03 0%,#78350f 40%,#92400e 100%);
           box-shadow:4px 0 40px rgba(120,53,15,.5)">

    <!-- Decorative glow -->
    <div class="absolute -top-20 -left-20 w-56 h-56 rounded-full opacity-20 pointer-events-none"
      style="background:radial-gradient(circle,#f59e0b 0%,transparent 70%)"></div>

    <!-- Logo -->
    <div class="flex items-center px-4 flex-shrink-0 relative"
      [ngClass]="collapsed?'h-[72px] justify-center':'h-[72px]'"
      style="border-bottom:1px solid rgba(245,158,11,.15)">
      <div *ngIf="!collapsed" class="flex items-center gap-3 w-full">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
          style="background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 20px rgba(245,158,11,.5)">
          <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-white text-[15px] tracking-tight m-0 leading-tight">ERP</p>
          <p class="text-[10px] font-medium m-0 mt-0.5" style="color:#fcd34d">Stratro Tech</p>
        </div>
        <button (click)="collapsed=true"
          class="ml-auto w-7 h-7 rounded-lg border-0 cursor-pointer transition-all duration-200 flex items-center justify-center text-amber-300 hover:text-white hover:bg-white/10 flex-shrink-0"
          style="background:transparent">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>
      <div *ngIf="collapsed" class="flex flex-col items-center gap-0 w-full">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center"
          style="background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 20px rgba(245,158,11,.5)">
          <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Expand button (collapsed) -->
    <div *ngIf="collapsed" class="flex justify-center pt-3">
      <button (click)="collapsed=false"
        class="w-8 h-8 rounded-lg border-0 cursor-pointer flex items-center justify-center text-amber-300 hover:text-white transition-all duration-200"
        style="background:rgba(255,255,255,.06)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <!-- Section label -->
    <div *ngIf="!collapsed" class="px-5 pt-6 pb-2">
      <span class="text-[10px] font-bold uppercase tracking-[0.18em]" style="color:rgba(252,211,77,.35)">Navegación</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 flex flex-col gap-1 overflow-y-auto overflow-x-hidden"
      [ngClass]="collapsed?'py-3 items-center':'py-1'">
      <button *ngFor="let item of menuItems"
        (click)="onNavigate(item.id)"
        [title]="item.label"
        class="w-full flex items-center border-0 cursor-pointer font-medium transition-all duration-200 relative group"
        [ngClass]="collapsed
          ? 'justify-center w-11 h-11 rounded-xl p-0'
          : 'px-3 py-2.5 gap-3 rounded-xl text-[13px]'"
        [style]="isActive(item.id)
          ? (collapsed
            ? 'background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 16px rgba(245,158,11,.45)'
            : 'background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(217,119,6,.1));color:#fff;')
          : 'background:transparent;color:rgba(252,211,77,.6)'">
        <span *ngIf="isActive(item.id) && !collapsed"
          class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 rounded-r-full"
          style="background:linear-gradient(180deg,#fcd34d,#fbbf24)"></span>
        <span class="flex-shrink-0 flex items-center justify-center w-5 h-5 transition-transform duration-200 group-hover:scale-110"
          [innerHTML]="item.svg"></span>
        <span *ngIf="!collapsed" class="truncate leading-none">{{ item.label }}</span>
        <span *ngIf="collapsed"
          class="pointer-events-none absolute left-full ml-4 px-3 py-2 rounded-lg text-xs font-semibold text-white whitespace-nowrap opacity-0 group-hover:opacity-100 translate-x-1 group-hover:translate-x-0 transition-all duration-200 z-50"
          style="background:#78350f;box-shadow:0 8px 32px rgba(120,53,15,.6);border:1px solid rgba(245,158,11,.15)">
          {{ item.label }}
        </span>
      </button>
    </nav>

    <!-- Divider -->
    <div class="mx-4 my-2" style="height:1px;background:linear-gradient(90deg,transparent,rgba(245,158,11,.15),transparent)"></div>

    <!-- User -->
    <div *ngIf="!collapsed" class="mx-3 mb-3 p-3 rounded-xl"
      style="background:rgba(255,255,255,.04);border:1px solid rgba(245,158,11,.08)">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0 relative overflow-hidden"
          style="background:linear-gradient(135deg,#f59e0b,#d97706)">
          <img *ngIf="logo" [src]="logo" class="w-full h-full object-cover" />
          <span *ngIf="!logo">{{ userName.charAt(0) }}</span>
          <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-amber-400 border-2" style="border-color:#451a03"></span>
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white m-0">{{ userName }}</p>
          <p class="text-[10px] m-0 mt-0.5 truncate" style="color:rgba(252,211,77,.6)">{{ userEmail }}</p>
        </div>
      </div>
    </div>
    <div *ngIf="collapsed" class="flex justify-center pb-3">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold text-white relative overflow-hidden"
        style="background:linear-gradient(135deg,#f59e0b,#d97706)">
        <img *ngIf="logo" [src]="logo" class="w-full h-full object-cover" />
        <span *ngIf="!logo">{{ userName.charAt(0) }}</span>
        <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-amber-400 border-2" style="border-color:#451a03"></span>
      </div>
    </div>
  </aside>

  <!-- ───── MAIN ───── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <header class="h-16 flex items-center px-6 gap-4 flex-shrink-0 transition-colors duration-300"
      [style]="darkMode
        ? 'background:rgba(17,24,39,.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(75,85,99,.3)'
        : 'background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(245,158,11,.1);box-shadow:0 1px 12px rgba(245,158,11,.06)'">
      <button (click)="mobileOpen=true" class="lg:hidden border-0 cursor-pointer p-2 rounded-xl text-amber-600 hover:bg-amber-50">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="flex items-center gap-2.5">
        <div class="w-1 h-6 rounded-full" style="background:linear-gradient(180deg,#f59e0b,#fcd34d)"></div>
        <h1 class="text-sm font-bold m-0" [style.color]="darkMode ? '#f3f4f6' : '#451a03'">{{ getActiveLabel() }}</h1>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <button (click)="toggleTheme()"
          class="w-9 h-9 rounded-xl flex items-center justify-center border-0 cursor-pointer transition-all duration-200 hover:scale-105"
          [style]="darkMode
            ? 'background:rgba(250,204,21,.1);color:#fbbf24'
            : 'background:rgba(245,158,11,.08);color:#d97706'">
          <svg *ngIf="darkMode" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg *ngIf="!darkMode" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold text-white cursor-pointer hover:scale-105 transition-transform"
          style="background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 2px 10px rgba(245,158,11,.38)">A</div>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-5 transition-colors duration-300"
      [style]="darkMode ? 'background:#0f1729' : ''">
      <ng-content></ng-content>
    </main>
  </div>
</div>

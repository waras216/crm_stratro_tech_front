<div class="flex flex-col gap-5 page-enter">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="m-0 text-lg font-bold text-slate-800">Órdenes de Compra</h2>
      <p class="text-xs text-slate-500 m-0 mt-1">Pendiente: ${{ totalPendiente.toLocaleString() }}</p>
    </div>
    <button (click)="openNew()" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium border-0 cursor-pointer hover:bg-amber-700">+ Nueva Orden</button>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden scale-in delay-2">
    <table class="w-full text-sm border-collapse">
      <thead>
        <tr class="bg-slate-50">
          <th class="text-left px-4 py-3 font-medium text-slate-500"># Orden</th>
          <th class="text-left px-4 py-3 font-medium text-slate-500">Proveedor</th>
          <th class="text-left px-4 py-3 font-medium text-slate-500">Fecha</th>
          <th class="text-right px-4 py-3 font-medium text-slate-500">Items</th>
          <th class="text-right px-4 py-3 font-medium text-slate-500">Total</th>
          <th class="text-center px-4 py-3 font-medium text-slate-500">Estado</th>
          <th class="text-right px-4 py-3 font-medium text-slate-500">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of ordenes" class="border-b border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-mono text-xs">#{{ o.id }}</td>
          <td class="px-4 py-3 font-medium">{{ o.proveedor }}</td>
          <td class="px-4 py-3 text-slate-500">{{ o.fecha }}</td>
          <td class="px-4 py-3 text-right">{{ o.items }}</td>
          <td class="px-4 py-3 text-right font-medium">${{ o.total.toLocaleString() }}</td>
          <td class="px-4 py-3 text-center">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium"
              [ngClass]="{'badge-amber': o.estado==='pendiente', 'badge-green': o.estado==='recibida', 'badge-red': o.estado==='cancelada'}">
              {{ o.estado }}
            </span>
          </td>
          <td class="px-4 py-3 text-right">
            <button *ngIf="o.estado==='pendiente'" (click)="recibir(o.id)" class="text-xs text-emerald-600 font-medium bg-transparent border-0 cursor-pointer hover:underline mr-2">Recibir</button>
            <button *ngIf="o.estado==='pendiente'" (click)="cancelar(o.id)" class="text-xs text-red-500 font-medium bg-transparent border-0 cursor-pointer hover:underline">Cancelar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div *ngIf="dialogOpen" class="fixed inset-0 bg-black/40 z-[100]" (click)="dialogOpen=false"></div>
  <div *ngIf="dialogOpen" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl w-[90%] max-w-md z-[101] shadow-2xl p-6 modal-in">
    <h3 class="m-0 mb-4 text-lg font-semibold">Nueva Orden de Compra</h3>
    <div class="flex flex-col gap-3">
      <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm" [(ngModel)]="form.proveedor" placeholder="Proveedor" />
      <div class="grid grid-cols-2 gap-3">
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm" type="number" [(ngModel)]="form.items" placeholder="Cant. Items" />
        <input class="px-3 py-2 border border-slate-200 rounded-lg text-sm" type="number" [(ngModel)]="form.total" placeholder="Total $" />
      </div>
      <button (click)="submit()" class="w-full py-2.5 bg-amber-600 text-white rounded-lg border-0 cursor-pointer text-sm font-semibold hover:bg-amber-700">Crear Orden</button>
    </div>
  </div>
</div>

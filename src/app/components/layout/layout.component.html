<div class="flex h-screen overflow-hidden" style="background:linear-gradient(135deg,#f0f2ff 0%,#faf5ff 100%)">

  <!-- Mobile overlay -->
  <div *ngIf="mobileOpen" (click)="mobileOpen=false"
    class="fixed inset-0 z-40 lg:hidden"
    style="background:rgba(30,27,75,.55);backdrop-filter:blur(4px)"></div>

  <!-- ───── SIDEBAR ───── -->
  <aside [ngClass]="collapsed?'w-[70px]':'w-60'"
    class="flex-shrink-0 flex flex-col transition-all duration-300 z-50 relative"
    style="background:linear-gradient(175deg,#1e1b4b 0%,#312e81 55%,#4c1d95 100%);
           box-shadow:4px 0 32px rgba(30,27,75,.35)">

    <!-- Logo -->
    <div class="flex items-center h-16 px-4 flex-shrink-0"
      style="border-bottom:1px solid rgba(255,255,255,.08)">
      <div *ngIf="!collapsed" class="flex items-center gap-3 w-full fade-up">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0"
          style="background:linear-gradient(135deg,#818cf8,#a78bfa);box-shadow:0 0 18px rgba(129,140,248,.55)">
          <!-- target icon -->
          <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="font-extrabold text-white text-sm tracking-tight m-0 leading-tight">CRM Pro</p>
          <p class="text-[10px] font-medium m-0" style="color:#a5b4fc">Stratro Tech</p>
        </div>
        <button (click)="collapsed=true"
          class="ml-auto p-1.5 rounded-lg border-0 cursor-pointer transition-colors text-indigo-300 hover:text-white flex-shrink-0"
          style="background:rgba(255,255,255,.07)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>
      <div *ngIf="collapsed" class="flex flex-col items-center gap-2 w-full">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center"
          style="background:linear-gradient(135deg,#818cf8,#a78bfa);box-shadow:0 0 18px rgba(129,140,248,.55)">
          <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <button (click)="collapsed=false"
          class="p-1.5 rounded-lg border-0 cursor-pointer text-indigo-300 hover:text-white"
          style="background:rgba(255,255,255,.07)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Section label -->
    <div *ngIf="!collapsed" class="px-4 pt-5 pb-1">
      <span class="text-[9px] font-bold uppercase tracking-[0.15em]" style="color:rgba(165,180,252,.45)">Menú</span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-2 flex flex-col gap-0.5 overflow-y-auto">
      <button *ngFor="let item of menuItems"
        (click)="onNavigate(item.id)"
        [title]="item.label"
        class="w-full flex items-center rounded-xl border-0 cursor-pointer text-sm font-semibold transition-all duration-150 relative group"
        [ngClass]="collapsed?'justify-center py-3 px-0':'px-3 py-2.5 gap-3'"
        [style]="moduloActivo===item.id
          ? 'background:linear-gradient(135deg,rgba(99,102,241,.9),rgba(139,92,246,.85));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.38)'
          : 'background:transparent;color:rgba(165,180,252,.75)'">
        <!-- icon -->
        <span class="flex-shrink-0 flex items-center justify-center w-5 h-5" [innerHTML]="item.svg"></span>
        <span *ngIf="!collapsed" class="truncate leading-none">{{ item.label }}</span>
        <!-- active dot -->
        <span *ngIf="moduloActivo===item.id && !collapsed" class="ml-auto w-1.5 h-1.5 rounded-full bg-white/70 flex-shrink-0"></span>
        <!-- collapsed tooltip -->
        <span *ngIf="collapsed"
          class="pointer-events-none absolute left-full ml-3 px-2.5 py-1.5 rounded-xl text-xs font-semibold text-white whitespace-nowrap opacity-0 group-hover:opacity-100 transition-all z-50 shadow-xl"
          style="background:rgba(30,27,75,.95)">{{ item.label }}</span>
      </button>
    </nav>

    <!-- User -->
    <div *ngIf="!collapsed" class="mx-2 mb-3 p-3 rounded-xl"
      style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
          style="background:linear-gradient(135deg,#818cf8,#a78bfa)">A</div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white m-0">Administrador</p>
          <p class="text-[10px] m-0 truncate" style="color:#a5b4fc">admin&#64;crm.pro</p>
        </div>
        <div class="ml-auto w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0" title="En línea"></div>
      </div>
    </div>
    <div *ngIf="collapsed" class="flex justify-center pb-3">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white"
        style="background:linear-gradient(135deg,#818cf8,#a78bfa)">A</div>
    </div>
  </aside>

  <!-- ───── MAIN ───── -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <header class="h-16 flex items-center px-6 gap-4 flex-shrink-0"
      style="background:rgba(255,255,255,.82);backdrop-filter:blur(14px);
             border-bottom:1px solid rgba(99,102,241,.1);box-shadow:0 1px 12px rgba(99,102,241,.06)">
      <button (click)="mobileOpen=true" class="lg:hidden border-0 cursor-pointer p-2 rounded-xl text-indigo-600 hover:bg-indigo-50">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Page title -->
      <div class="flex items-center gap-2.5">
        <div class="w-1 h-6 rounded-full" style="background:linear-gradient(180deg,#6366f1,#a78bfa)"></div>
        <h1 class="text-sm font-bold m-0" style="color:#1e1b4b">{{ getActiveLabel() }}</h1>
      </div>

      <!-- Right side -->
      <div class="ml-auto flex items-center gap-2">
        <!-- Search hint -->
        <div class="hidden md:flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-medium text-indigo-400 cursor-text"
          style="background:rgba(99,102,241,.06);border:1.5px solid rgba(99,102,241,.1)">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Buscar…</span>
          <kbd class="px-1.5 py-0.5 rounded text-[10px]" style="background:rgba(99,102,241,.1);color:#6366f1">⌘K</kbd>
        </div>
        <!-- Bell -->
        <button class="relative w-9 h-9 rounded-xl flex items-center justify-center border-0 cursor-pointer transition-all hover:scale-105"
          style="background:rgba(99,102,241,.08);color:#6366f1">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="absolute -top-0.5 -right-0.5 w-3.5 h-3.5 rounded-full flex items-center justify-center text-[8px] font-bold text-white"
            style="background:linear-gradient(135deg,#f43f5e,#e11d48)">3</span>
        </button>
        <!-- Avatar -->
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold text-white cursor-pointer hover:scale-105 transition-transform"
          style="background:linear-gradient(135deg,#6366f1,#a78bfa);box-shadow:0 2px 10px rgba(99,102,241,.38)">A</div>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-5">
      <ng-content></ng-content>
    </main>
  </div>
</div>

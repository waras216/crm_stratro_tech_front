<div class="space-y">
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="input" placeholder="Buscar leads..." [(ngModel)]="search" />
      </div>
      <select class="select" [(ngModel)]="filterEstatus">
        <option value="todos">Todos</option>
        <option *ngFor="let e of estatusOptions" [value]="e">{{ e }}</option>
      </select>
    </div>
    <button class="btn btn-primary" (click)="openNew()">+ Nuevo Lead</button>
  </div>

  <!-- Table -->
  <div class="card p-0">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th><th>Email</th><th>Teléfono</th><th>Fuente</th><th>Estatus</th><th>Fecha</th><th class="text-right">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let lead of filtered">
            <td class="fw-medium">{{ lead.nombre }}</td>
            <td>{{ lead.email }}</td>
            <td>{{ lead.telefono }}</td>
            <td>{{ lead.fuente }}</td>
            <td><span class="badge" [ngClass]="estatusColors[lead.estatus]">{{ lead.estatus }}</span></td>
            <td class="text-muted">{{ lead.fecha_creacion }}</td>
            <td class="text-right">
              <button class="btn-ghost" (click)="handleEdit(lead)">✏️</button>
              <button class="btn-ghost" (click)="deleteLead(lead.id)">🗑️</button>
            </td>
          </tr>
          <tr *ngIf="filtered.length === 0">
            <td colspan="7" class="empty-row">No se encontraron leads</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Dialog -->
  <div class="modal-backdrop" *ngIf="dialogOpen" (click)="closeDialog()"></div>
  <div class="modal" *ngIf="dialogOpen">
    <div class="modal-header">
      <h2>{{ editingLead ? 'Editar Lead' : 'Nuevo Lead' }}</h2>
      <button class="btn-ghost" (click)="closeDialog()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nombre *</label>
        <input class="input" [(ngModel)]="form.nombre" placeholder="Nombre completo" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input class="input" [(ngModel)]="form.email" placeholder="correo@email.com" type="email" />
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input class="input" [(ngModel)]="form.telefono" placeholder="555-0000" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Fuente</label>
          <select class="select w-full" [(ngModel)]="form.fuente">
            <option *ngFor="let f of fuenteOptions" [value]="f">{{ f }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estatus</label>
          <select class="select w-full" [(ngModel)]="form.estatus">
            <option *ngFor="let e of estatusOptions" [value]="e">{{ e }}</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary w-full" (click)="handleSubmit()">
        {{ editingLead ? 'Guardar Cambios' : 'Crear Lead' }}
      </button>
    </div>
  </div>
</div>

<div class="flex items-center justify-between bg-white border border-slate-200 rounded-xl px-4 py-3">
  <div class="flex items-center gap-2 text-slate-500">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span class="text-xs font-semibold">Descargar reporte</span>
  </div>
  <div class="flex items-center gap-2">
    <button (click)="pdf.emit()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold text-white border-0 cursor-pointer transition-all hover:scale-105 active:scale-95"
      style="background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 12px rgba(239,68,68,.35)">
      <span class="w-5 h-5 rounded flex items-center justify-center text-[8px] font-extrabold tracking-tight flex-shrink-0" style="background:rgba(255,255,255,.25)">PDF</span>
      Exportar PDF
    </button>
    <button (click)="excel.emit()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold text-white border-0 cursor-pointer transition-all hover:scale-105 active:scale-95"
      style="background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 4px 12px rgba(34,197,94,.35)">
      <span class="w-5 h-5 rounded flex items-center justify-center text-[8px] font-extrabold tracking-tight flex-shrink-0" style="background:rgba(255,255,255,.25)">XLS</span>
      Exportar Excel
    </button>
  </div>
</div>

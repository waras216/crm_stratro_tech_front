<div class="fixed top-4 right-4 z-[200] flex gap-1.5 p-1.5 rounded-2xl shadow-xl"
  style="background:rgba(15,10,46,.92);backdrop-filter:blur(12px);border:1px solid rgba(129,140,248,.15)">
  <button (click)="switchApp.emit('crm')"
    class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200"
    [ngClass]="activeApp==='crm' ? 'text-white shadow-lg' : 'text-indigo-300 hover:text-white hover:bg-white/5'"
    [style]="activeApp==='crm' ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6)' : 'background:transparent'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    CRM
  </button>
  <button (click)="switchApp.emit('pos')"
    class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200"
    [ngClass]="activeApp==='pos' ? 'text-white shadow-lg' : 'text-emerald-300 hover:text-white hover:bg-white/5'"
    [style]="activeApp==='pos' ? 'background:linear-gradient(135deg,#059669,#10b981)' : 'background:transparent'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    POS
  </button>
  <button (click)="switchApp.emit('erp')"
    class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200"
    [ngClass]="activeApp==='erp' ? 'text-white shadow-lg' : 'text-amber-300 hover:text-white hover:bg-white/5'"
    [style]="activeApp==='erp' ? 'background:linear-gradient(135deg,#d97706,#f59e0b)' : 'background:transparent'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
    ERP
  </button>
</div>

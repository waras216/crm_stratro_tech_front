<!-- ── Backdrop ── -->
<div *ngIf="open" class="backdrop" (click)="open=false"></div>

<!-- ══════════ LAUNCHER PANEL ══════════ -->
<div *ngIf="open" class="launcher">

  <!-- Header -->
  <div class="launcher-header">
    <div>
      <p class="launcher-title">STRATO Hub</p>
      <p class="launcher-subtitle">Strato Tech Solutions</p>
    </div>
    <span *ngIf="!isConfigRoute" class="active-chip" [style]="'background:' + activeModule.accent + '22;color:' + activeModule.accent">
      <span class="active-chip-dot" [style]="'background:' + activeModule.accent"></span>
      {{ activeModule.label }} activo
    </span>
    <span *ngIf="isConfigRoute" class="active-chip" style="background:rgba(99,102,241,.15);color:#a5b4fc">
      <span class="active-chip-dot" style="background:#6366f1"></span>
      Configuración
    </span>
  </div>

  <!-- Active modules grid -->
  <div class="modules-grid">
    <button *ngFor="let mod of modules" (click)="navigate(mod.id)"
      class="module-card"
      [class.module-card--active]="isActive(mod.id)"
      [style]="isActive(mod.id)
        ? 'border:2px solid ' + mod.accent + ';background:rgba(255,255,255,.07)'
        : 'border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)'">

      <div class="mod-icon" [style]="'background:' + mod.activeGradient + ';box-shadow:' + mod.activeShadow">
        <span [innerHTML]="safe(mod.icon)"></span>
      </div>

      <span class="mod-label">{{ mod.label }}</span>

      <!-- Active indicator dot -->
      <span *ngIf="isActive(mod.id)" class="mod-active-dot" [style]="'background:' + mod.accent"></span>
    </button>
  </div>

  <!-- Divider -->
  <div class="launcher-divider"></div>

  <!-- Future modules -->
  <p class="future-label">Próximamente</p>
  <div class="future-grid">
    <div *ngFor="let mod of futureModules" class="future-card" [title]="mod.label">
      <div class="future-icon">
        <span [innerHTML]="safe(mod.icon)"></span>
      </div>
      <span class="future-name">{{ mod.label }}</span>
    </div>
  </div>

  <!-- Configuración global -->
  <button (click)="goToConfig()" class="config-btn" [class.config-btn--active]="isConfigRoute">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/>
    </svg>
    <span>Configuración</span>
    <svg class="config-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </button>

  <!-- Footer -->
  <div class="launcher-footer">
    <div class="footer-company">
      <div class="footer-logo" [style]="logo ? '' : 'background:' + activeModule.activeGradient">
        <img *ngIf="logo" [src]="logo" class="footer-logo-img" alt="logo" />
        <span *ngIf="!logo" style="font-size:9px;font-weight:800;color:#fff">{{ companyName.charAt(0) }}</span>
      </div>
      <span class="footer-company-name">{{ companyName }}</span>
    </div>
    <span class="footer-powered">by STRATO Hub</span>
  </div>
</div>

<!-- ══════════ FAB BUTTON ══════════ -->
<button *ngIf="!isConfigRoute" (click)="toggle()" class="fab"
  [style]="open
    ? 'background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 6px 28px rgba(239,68,68,.5)'
    : 'background:' + activeModule.activeGradient + ';box-shadow:0 6px 28px rgba(0,0,0,.35)'">

  <!-- Grid icon -->
  <svg *ngIf="!open" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="7" rx="1.5"/>
    <rect x="14" y="3" width="7" height="7" rx="1.5"/>
    <rect x="3" y="14" width="7" height="7" rx="1.5"/>
    <rect x="14" y="14" width="7" height="7" rx="1.5"/>
  </svg>

  <!-- Close icon -->
  <svg *ngIf="open" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5"
    stroke-linecap="round" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

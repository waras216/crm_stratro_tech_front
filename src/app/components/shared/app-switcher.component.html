<!-- Backdrop -->
<div *ngIf="open" class="fixed inset-0 z-[199]" (click)="open=false"></div>

<!-- Floating menu -->
<div *ngIf="open" class="fixed bottom-20 right-5 z-[200] flex flex-col gap-2 p-2 rounded-2xl scale-in"
  style="background:rgba(15,10,46,.94);backdrop-filter:blur(14px);border:1px solid rgba(129,140,248,.15);box-shadow:0 12px 40px rgba(15,10,46,.6)">
  <button (click)="navigate('crm')"
    class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200 w-full"
    [ngClass]="isActive('crm') ? 'text-white' : 'text-indigo-300 hover:text-white hover:bg-white/5'"
    [style]="isActive('crm') ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6)' : 'background:transparent'">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    CRM
  </button>
  <button (click)="navigate('pos')"
    class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200 w-full"
    [ngClass]="isActive('pos') ? 'text-white' : 'text-emerald-300 hover:text-white hover:bg-white/5'"
    [style]="isActive('pos') ? 'background:linear-gradient(135deg,#059669,#10b981)' : 'background:transparent'">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    POS
  </button>
  <button (click)="navigate('erp')"
    class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200 w-full"
    [ngClass]="isActive('erp') ? 'text-white' : 'text-amber-300 hover:text-white hover:bg-white/5'"
    [style]="isActive('erp') ? 'background:linear-gradient(135deg,#d97706,#f59e0b)' : 'background:transparent'">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
    </svg>
    ERP
  </button>
  <div class="mx-2 my-1" style="height:1px;background:rgba(129,140,248,.15)"></div>
  <button (click)="navigate('crm/configuracion')"
    class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200 w-full"
    [ngClass]="isActive('crm/configuracion') ? 'text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'"
    [style]="isActive('crm/configuracion') ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6)' : 'background:transparent'">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M12 2v2M12 20v2M2 12h2M20 12h2"/>
    </svg>
    Configuración
  </button>
  <button (click)="navigate('pricing')"
    class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold border-0 cursor-pointer transition-all duration-200 w-full"
    [ngClass]="isActive('pricing') ? 'text-white' : 'text-yellow-300 hover:text-white hover:bg-white/5'"
    [style]="isActive('pricing') ? 'background:linear-gradient(135deg,#6366f1,#8b5cf6)' : 'background:transparent'">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>
    </svg>
    Planes
  </button>
</div>

<!-- FAB Button -->
<button (click)="toggle()"
  class="fixed bottom-5 right-5 z-[200] w-12 h-12 rounded-full border-0 cursor-pointer flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95"
  [style]="open
    ? 'background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 20px rgba(239,68,68,.4)'
    : 'background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 4px 20px rgba(99,102,241,.5)'">
  <!-- Grid icon (closed) -->
  <svg *ngIf="!open" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  </svg>
  <!-- X icon (open) -->
  <svg *ngIf="open" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

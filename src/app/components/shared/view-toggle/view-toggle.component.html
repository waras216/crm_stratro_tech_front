<div class="inline-flex items-center rounded-xl overflow-hidden flex-shrink-0" style="border:1.5px solid rgba(99,102,241,.15)" role="group" aria-label="Cambiar vista">
  <button type="button" (click)="set('grid')" [attr.aria-pressed]="value==='grid'" [title]="gridLabel"
    class="flex items-center gap-1.5 px-3 py-2.5 text-xs font-semibold border-0 cursor-pointer transition-colors"
    [class.text-white]="value==='grid'" [class.text-slate-400]="value!=='grid'"
    [style.background]="value==='grid' ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : '#fff'">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    <span class="hidden sm:inline">{{ gridLabel }}</span>
  </button>
  <button type="button" (click)="set('table')" [attr.aria-pressed]="value==='table'" [title]="tableLabel"
    class="flex items-center gap-1.5 px-3 py-2.5 text-xs font-semibold border-0 cursor-pointer transition-colors"
    [class.text-white]="value==='table'" [class.text-slate-400]="value!=='table'"
    [style.background]="value==='table' ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : '#fff'"
    style="border-left:1.5px solid rgba(99,102,241,.15)">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
    <span class="hidden sm:inline">{{ tableLabel }}</span>
  </button>
</div>

<button [type]="type" [disabled]="disabled || loading" [attr.aria-label]="ariaLabel || null"
  class="inline-flex items-center justify-center gap-2 font-semibold border-0 cursor-pointer transition-all rounded-xl disabled:opacity-60 disabled:cursor-not-allowed"
  [ngClass]="{
    'btn-accent': variant === 'primary',
    'text-white': variant === 'primary' || variant === 'danger',
    'hover:opacity-90': variant === 'primary',
    'bg-slate-100 text-slate-700 hover:bg-slate-200': variant === 'secondary',
    'bg-transparent text-slate-500 hover:bg-slate-100': variant === 'ghost',
    'bg-red-600 hover:bg-red-500': variant === 'danger',
    'text-xs px-3 py-1.5': size === 'sm',
    'text-sm px-4 py-2.5': size === 'md',
    'text-base px-5 py-3': size === 'lg',
    'w-full': fullWidth
  }">
  <svg *ngIf="loading" class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
    <circle cx="12" cy="12" r="9" stroke-opacity=".25"/>
    <path d="M21 12a9 9 0 0 0-9-9" stroke-linecap="round"/>
  </svg>
  <ng-content></ng-content>
</button>

<div class="fixed bottom-6 left-1/2 z-[150] flex items-center gap-4 px-5 py-3 rounded-2xl bulk-bar-in"
  style="background:#1e1b4b;box-shadow:0 12px 32px rgba(30,27,75,.35)">
  <span class="text-sm font-semibold text-white whitespace-nowrap">{{ label }}</span>
  <div class="flex items-center gap-2">
    <button type="button" (click)="clearSelection.emit()"
      class="px-3 py-1.5 rounded-lg text-xs font-semibold border-0 cursor-pointer text-slate-300 hover:bg-white/10 transition-colors">
      Cancelar
    </button>
    <button type="button" (click)="deleteSelected.emit()"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-white border-0 cursor-pointer transition-all hover:scale-105 active:scale-95"
      style="background:#e11d48">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Eliminar
    </button>
  </div>
</div>
